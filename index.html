/* ---------- ev sahibi motoru (yalnızca ev sahibinin cihazında çalışır) ---------- */
let S=null;
const tot=l=>VOT.reduce((s,n)=>s+S.trust[n][l],0);
const sums=()=>Object.fromEntries(LON.map(l=>[l,tot(l)]));
const snapAll=()=>Object.fromEntries(LON.map(l=>[l,Object.fromEntries(VOT.map(n=>[n,S.trust[n][l]]))]));
const humans=l=>Object.values(S.players).filter(p=>p.lonca===l);
const EV=id=>S.events.find(e=>e.id===id);
function addT(n,l,d){S.trust[n][l]=clamp(S.trust[n][l]+d)}
function newRoom(code,hostPid){S={code,hostPid,phase:'lobby',players:{},turn:180000,len:10,counts:{exposed:0,broken:0,betray:0},bulletin:[],result:null}}
function startGame(){
 const trust={};IDS.forEach(n=>{trust[n]={};LON.forEach(l=>trust[n][l]=Math.round(R()*16-8))});
 Object.assign(S,{phase:'play',day:1,trust,gold:{tuz:100,gemici:100,kervan:100},secrets:{tuz:[],gemici:[],kervan:[]},events:[],promises:[],grudges:[],
  allies:{tuz:null,gemici:null,kervan:null},allyUsed:{},pending:{},hostile:{},bonus:{},bonusNext:{},rep:{},log:[],bulletin:[{k:'welcome',a:{len:S.len}}],next:[],evening:{},
  result:null,eid:0,counts:{exposed:0,broken:0,betray:0}});
 Object.values(S.players).forEach(p=>{p.moves=6;p.ready=false});
 S.snap=snapAll();S.dayStart=sums();S.deadline=Date.now()+S.turn;
}
function mkEv(a,k,n,x){const e={id:++S.eid,day:S.day,actor:a,kind:k,npc:n,hop:{[n]:0},exag:false,exposed:false,...(x||{})};S.events.push(e);return e}
function detect(e){if(!e.exposed&&R()<.6){e.exposed=true;VOT.forEach(v=>addT(v,e.actor,-15));S.counts.exposed++;S.next.push({k:'exposed',a:{l:e.actor,t:e.target}})}}
function pickRival(a){const o=LON.filter(x=>x!==a);return o[(R()*o.length)|0]}
function breakAlly(by){const p=S.allies[by];if(!p)return;S.allies[by]=null;S.allies[p]=null;S.hostile[p]=by;S.counts.betray++;
 mkEv(by,'ihanet','leyla',{broadcast:true});S.log.push({l:by,k:'brk',a:{day:S.day,l:p}},{l:p,k:'brk',a:{day:S.day,l:by}})}
function doMove(a,kind,n,o){
 o=o||{};const nb=NPC[n],key=a+n+kind,rep=S.rep[key]||0,f=1/(1+rep);let d=0,extra={};
 if((kind==='soylenti'||kind==='sir')&&o.human&&S.allies[a]===o.target)return{ok:false,why:'ally'};
 if(kind==='rusvet'){
  if(S.gold[a]<25)return{ok:false,why:'gold'};S.gold[a]-=25;
  if(n==='demirhan'){d=-25;mkEv(a,'rusvet',n,{broadcast:true})}
  else{d=nb.likes.rusvet*f;mkEv(a,'rusvet',n);if(n==='riza'||n==='mert'){const tg=pickRival(a);S.secrets[a].push(tg);extra.secret=tg}}
 }else if(kind==='tehdit'){d=nb.likes.tehdit*f;if(n==='yusuf')S.grudges.push({l:a,day:S.day+2});mkEv(a,'tehdit',n)}
 else if(kind==='soylenti'){
  const tg=o.target;let fake=true;
  if(o.truth){const i=S.secrets[a].indexOf(tg);if(i<0)return{ok:false,why:'secret'};S.secrets[a].splice(i,1);fake=false}
  addT(n,tg,-12*f);d=nb.likes.soylenti;const e=mkEv(a,'soylenti',n,{target:tg,fake});if(n==='hatice'&&fake)detect(e);extra.target=tg;
 }else if(kind==='sir'){
  const tg=o.target,i=S.secrets[a].indexOf(tg);if(i<0)return{ok:false,why:'secret'};S.secrets[a].splice(i,1);addT(n,tg,-20);d=nb.likes.sir;extra.target=tg;
 }else if(kind==='soz'){d=nb.likes.soz*f;S.promises.push({l:a,n,due:S.day+3})}
 else d=nb.likes.iltifat*f;
 S.rep[key]=rep+1;addT(n,a,d);return{ok:true,d:Math.round(d),...extra};
}
function targets(s){const g=NPC[s].gossip,o=IDS.filter(x=>x!==s);if(g==='all')return o;if(!g)return o.sort(()=>R()-.5).slice(0,3);return g}
function react(t,e,m){const a=e.actor;
 if(e.kind==='soylenti'){if(!e.exposed){addT(t,e.target,-8*m);if(t==='hatice'&&e.fake)detect(e)}}
 else if(e.kind==='rusvet'){if(t==='demirhan'||t==='hatice')addT(t,a,-8*m);else if(t==='saadet')addT(t,a,-3*m)}
 else if(e.kind==='tehdit'){if(['hatice','saadet','demirhan'].includes(t))addT(t,a,-5*m)}
 else if(e.kind==='bozuk')addT(t,a,-(t==='saadet'?20:8)*m);
 else if(e.kind==='ihanet')addT(t,a,-4*m)}
function night(){
 const lines=[];
 S.events.forEach(e=>{
  if(S.day-e.day>4)return;
  if(e.broadcast){if(!e.cast){e.cast=true;IDS.forEach(t=>{if(!(t in e.hop)){e.hop[t]=1;react(t,e,1)}});S.next.push(e.kind==='rusvet'?{k:'reveal',a:{l:e.actor}}:{k:'betray',a:{l:e.actor}})}return}
  const before=Object.keys(e.hop).length;
  Object.keys(e.hop).forEach(s=>targets(s).forEach(t=>{if(t in e.hop)return;const h=e.hop[s]+1;e.hop[t]=h;const m=R()<(h===1?.2:h===2?.4:.7)?1.5:1;if(m>1)e.exag=true;react(t,e,m)}));
  const after=Object.keys(e.hop).length;
  if(after>before){const hid=e.kind==='soylenti'&&!e.exposed;lines.push({k:'whisper',a:{id:e.id,n:after,kind:e.kind,actor:e.actor,target:e.target,exag:e.exag,place:hid?e.npc:null,clue:hid&&R()<.5?e.actor:null}})}
 });
 lines.sort((x,y)=>y.a.n-x.a.n);S.next.push(...lines.slice(0,8));
}
function bot(L){
 const n=6+(S.bonus[L]||0);
 for(let i=0;i<n;i++){
  const foes=LON.filter(x=>x!==L&&S.allies[L]!==x).sort((x,y)=>tot(y)-tot(x));
  const foe=(S.hostile[L]&&R()<.6)?S.hostile[L]:foes[0];
  const sec=S.secrets[L].find(x=>S.allies[L]!==x);
  if(sec&&R()<.5){doMove(L,'sir',VOT[(R()*5)|0],{target:sec});continue}
  const r=R();
  if(r<.25&&foe){const teller=R()<.4?'leyla':R()<.5?'riza':VOT[(R()*5)|0];doMove(L,'soylenti',teller,{target:foe,truth:S.secrets[L].includes(foe)});continue}
  if(r<.35&&S.gold[L]>=25){doMove(L,'rusvet',R()<.5?'mert':'riza');continue}
  const gap=v=>Math.max(...LON.filter(x=>x!==L).map(x=>S.trust[v][x]))-S.trust[v][L];
  const v=VOT.slice().sort((p,q)=>gap(q)-gap(p))[0],lk=NPC[v].likes;
  let best=['iltifat','rusvet','tehdit','soz'].filter(k=>k!=='rusvet'||S.gold[L]>=25).sort((p,q)=>lk[q]-lk[p])[0];
  if(best==='tehdit'&&R()<.5)best='iltifat';doMove(L,best,v);
 }
}
function election(){
 const v={tuz:0,gemici:0,kervan:0},by={};
 VOT.forEach(n=>{const t=S.trust[n],s=LON.slice().sort((a,b)=>t[b]-t[a]);if(t[s[0]]>t[s[1]]){v[s[0]]++;by[n]=s[0]}else by[n]=null});
 const s=LON.slice().sort((a,b)=>v[b]-v[a]||tot(b)-tot(a));
 return{v,by,win:(v[s[0]]>v[s[1]]||tot(s[0])>tot(s[1]))&&v[s[0]]>0?s[0]:null};
}
function endDay(){
 if(S.phase!=='play')return;
 LON.forEach(l=>{const hs=humans(l);if(!hs.length)return;
  const used=hs.reduce((s,p)=>s+Math.max(0,6+(S.bonus[l]||0)-p.moves),0),ev=[{k:'used',a:{day:S.day,c:used}}];
  VOT.forEach(n=>{const d=S.trust[n][l]-S.snap[l][n];if(d)ev.push({k:'delta',a:{n,d}})});if(ev.length===1)ev.push({k:'none',a:{}});S.evening[l]=ev});
 LON.filter(l=>!humans(l).length).sort(()=>R()-.5).forEach(bot);
 S.promises.filter(p=>p.due===S.day).forEach(p=>{
  if(S.gold[p.l]>=30){S.gold[p.l]-=30;addT(p.n,p.l,10);S.next.push({k:'kept',a:{l:p.l,n:p.n},to:p.l})}
  else{addT(p.n,p.l,-40);mkEv(p.l,'bozuk',p.n);S.counts.broken++;S.next.push({k:'broken',a:{l:p.l,n:p.n}})}});
 S.promises=S.promises.filter(p=>p.due>S.day);
 S.grudges.filter(g=>g.day===S.day).forEach(g=>{addT('yusuf',g.l,-30);S.next.push({k:'grudge',a:{l:g.l}})});
 S.grudges=S.grudges.filter(g=>g.day>S.day);
 LON.forEach(l=>S.gold[l]+=20);
 S.bonusNext={};
 if(S.day===3||S.day===7){const now=sums(),best=LON.slice().sort((a,b)=>(now[b]-S.dayStart[b])-(now[a]-S.dayStart[a]))[0];S.bonusNext[best]=2;S.next.push({k:'bonus',a:{l:best}})}
 LON.forEach(l=>{const al=S.allies[l];if(!al)return;
  if(R()<.5){const third=LON.find(x=>x!==l&&x!==al);S.secrets[l].push(third);S.next.push({k:'allySecret',a:{t:third},to:l})}});
 LON.forEach(l=>{if(S.allies[l]&&!humans(l).length&&S.day>=6&&R()<.2)breakAlly(l)});
 night();
 S.bulletin=S.next.length?S.next:[{k:'quiet',a:{}}];S.next=[];
 if(S.day>=S.len){S.phase='over';S.result=election();S.kr=kronik()}
 else{S.day++;S.bonus=S.bonusNext;Object.values(S.players).forEach(p=>{p.moves=6+(S.bonus[p.lonca]||0);p.ready=false});S.rep={};S.snap=snapAll();S.dayStart=sums();S.deadline=Date.now()+S.turn}
}
function kronik(){
 const loud=S.events.filter(e=>e.kind!=='ihanet').sort((a,b)=>Object.keys(b.hop).length-Object.keys(a.hop).length)[0];
 return{loud:loud?{kind:loud.kind,actor:loud.actor,target:loud.target,exposed:loud.exposed,n:Object.keys(loud.hop).length}:null,counts:S.counts,
  teams:Object.fromEntries(LON.map(l=>[l,humans(l).map(p=>p.name)]))};
}
/* gelen istekleri işle */
function handle(m,from){
 const p=S.players[from];
 if(m.t==='hello'){
  if(!S.players[from]){const cnt=l=>humans(l).length,l=LON.slice().sort((a,b)=>cnt(a)-cnt(b))[0];S.players[from]={name:String(m.name||'?').slice(0,24),lonca:l,moves:6,ready:false}}
  else S.players[from].name=String(m.name||S.players[from].name).slice(0,24);
  return true}
 if(!p)return false;
 if(m.t==='pick'&&S.phase==='lobby'&&LON.includes(m.l)){p.lonca=m.l;return true}
 if(S.phase!=='play')return false;
 if(m.t==='move'){
  if(!MOVES.includes(m.kind)||!NPC[m.n])return false;
  if(p.moves<=0){reply(from,{t:'res',ok:false,why:'moves'});return false}
  const r=doMove(p.lonca,m.kind,m.n,{target:LON.includes(m.target)&&m.target!==p.lonca?m.target:pickRival(p.lonca),truth:!!m.truth||m.kind==='sir',human:true});
  if(!r.ok){reply(from,{t:'res',ok:false,why:r.why});return false}
  p.moves--;S.log.push({l:p.lonca,k:'move',a:{day:S.day,who:p.name,kind:m.kind,n:m.n,d:r.d,target:r.target,secret:r.secret}});
  reply(from,{t:'res',ok:true,n:m.n,good:r.d>=0});return true}
 if(m.t==='accuse'){
  const e=EV(m.id);if(!e||e.accused||e.kind!=='soylenti'||e.target!==p.lonca||e.exposed||!LON.includes(m.l))return false;
  if(p.moves<=0){reply(from,{t:'res',ok:false,why:'moves'});return false}
  p.moves--;e.accused=true;const ok=e.actor===m.l;
  if(ok){e.exposed=true;VOT.forEach(v=>{addT(v,m.l,-10);addT(v,p.lonca,5)});S.counts.exposed++}else VOT.forEach(v=>addT(v,p.lonca,-5));
  S.bulletin.forEach(b=>{if(b.k==='whisper'&&b.a.id===e.id){b.a.accused=true;if(ok){b.a.exposed=true;b.a.place=null;b.a.clue=null}}});
  out({t:'reveal',ok,l:m.l,by:p.lonca,who:p.name});return true}
 if(m.t==='ally'){
  const to=m.to,me_=p.lonca;if(!LON.includes(to)||to===me_||S.allies[me_]||S.allies[to]||S.allyUsed[me_]||S.allyUsed[to]||S.pending[to])return false;
  if(humans(to).length){S.pending[to]=me_;return true}
  const lead=LON.slice().sort((a,b)=>tot(b)-tot(a))[0],ok=R()<(lead===to?.35:.7);
  if(ok){S.allies[me_]=to;S.allies[to]=me_;S.allyUsed[me_]=S.allyUsed[to]=true}
  S.log.push({l:me_,k:'ally',a:{day:S.day,l:to,ok}});return true}
 if(m.t==='allyAns'){
  const fromL=S.pending[p.lonca];if(!fromL)return false;delete S.pending[p.lonca];
  if(m.ok&&!S.allies[fromL]&&!S.allies[p.lonca]){S.allies[fromL]=p.lonca;S.allies[p.lonca]=fromL;S.allyUsed[fromL]=S.allyUsed[p.lonca]=true}
  S.log.push({l:fromL,k:'ally',a:{day:S.day,l:p.lonca,ok:!!m.ok}});return true}
 if(m.t==='brk'){if(!S.allies[p.lonca])return false;breakAlly(p.lonca);return true}
 if(m.t==='ready'){p.ready=!!m.v;return true}
 return false;
}

function pub(){
 const base={code:S.code,hostPid:S.hostPid,phase:S.phase,len:S.len,turn:S.turn,players:S.players};
 if(S.phase==='lobby')return base;
 const dots={};IDS.forEach(n=>dots[n]=LON.filter(l=>S.events.some(e=>e.kind==='soylenti'&&e.target===l&&!e.exposed&&(n in e.hop)&&S.day-e.day<=4)));
 return{...base,day:S.day,deadline:S.deadline,trust:S.trust,gold:S.gold,secrets:S.secrets,allies:S.allies,allyUsed:S.allyUsed,pending:S.pending,
  bulletin:S.bulletin.map(x=>{if(x.k!=='whisper')return x;const e=EV(x.a.id);if(!e)return x;const a={...x.a,exposed:e.exposed,accused:!!e.accused};if(e.exposed){a.place=null;a.clue=null}return{...x,a}}),evening:S.evening,dots,log:S.log.slice(-60),result:S.result,kr:S.kr};
}

 if(isHost&&m.from&&m.t!=='chat'){if(handle(m,m.from))push();return}

 else if(m.t==='res'){if(!m.ok)toast(T().fail[m.why]);else{quote={n:m.n,good:m.good};render()}}

 sb=sb||window.supabase.createClient(SB_URL,SB_KEY);
 chan=sb.channel('sozsav-'+code,{config:{broadcast:{self:false}}});
 chan.on('broadcast',{event:'m'},({payload})=>onMsg(payload));
 fetch(SB_URL+'/auth/v1/health',{headers:{apikey:SB_KEY}}).then(r=>{health=r.ok?'ok':'HTTP '+r.status;render()}).catch(e=>{health='ERR '+e.message;render()});
 chan.subscribe((st,err)=>{net=st==='SUBSCRIBED'?'on':(st==='CHANNEL_ERROR'||st==='TIMED_OUT'||st==='CLOSED')?'off':'connecting';
  netErr=st==='SUBSCRIBED'?'':st+(err?': '+(err.message||err):'');if(netErr)console.warn('Realtime',netErr,err);
